<!--
  BRUG DENNE SKABELON TIL AT SKRIVE ET NYT OPSLAG.

  Sådan gør du:
  1. Åbn denne fil (template.html) her på GitHub, og kopiér hele indholdet
     (tryk på blyant-ikonet for at redigere, marker alt, kopiér).
  2. Gå tilbage til mappen "blog", og opret en ny fil ("Add file" →
     "Create new file"). Kald filen fx: 2026-09-01-mit-opslag.html
       - Start altid filnavnet med datoen: ÅÅÅÅ-MM-DD-
       - Brug kun små bogstaver, tal og bindestreger (ingen mellemrum,
         og ingen æ, ø eller å)
  3. Sæt det kopierede indhold ind i den nye fil.
  4. Udskift teksten i <title>, i overskriften (<h1>), i datoen
     (<p class="intro-lead">) og i resuméet (<p class="excerpt">).
  5. Skriv selve opslaget i afsnittene (<p>…</p>) nedenunder. Du kan
     tilføje flere afsnit ved at kopiere en af linjerne.
  6. Vil du have et billede med, kan du trække billedet ind i GitHub's
     redigeringsfelt, mens du redigerer filen — det bliver så automatisk
     uploadet, og der indsættes en linje du kan sætte ind i teksten.
  7. Scroll ned, skriv en kort besked om opslaget (fx "Nyt opslag: …"),
     og tryk "Commit changes" direkte til main.
  8. Opslaget er live om cirka et minut og vises automatisk øverst på
     opslagssiden — du behøver ikke rette andre filer.

  Denne kommentar vises ikke på hjemmesiden, så du behøver ikke slette
  den i din nye fil, men du er velkommen til det.
-->
